name: Windows CI

on:
  push:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]
  pull_request:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install WiX Toolset
      run: |
        dotnet tool install --global wix --version 4.0.0 || true
        # WiX Toolset is required by Compose Desktop to build MSI installers

    - name: Grant execute permission for gradlew
      run: git update-index --chmod=+x gradlew
      continue-on-error: true

    - name: Build Windows Executable
      run: ./gradlew.bat :windows-app:packageDistributionForCurrentOS

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: windows-app/build/compose/binaries/main/
