name: Windows CI

on:
  push:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]
  pull_request:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        arch: 'win64_msvc2019_64'
        modules: 'qtmultimedia'

    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -S windows-app -B windows-app/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build C++ Qt App
      run: cmake --build windows-app/build --config Release

    - name: Run windeployqt
      run: windeployqt windows-app/build/DTECH_MUSIC.exe --release --no-translations --compiler-runtime

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DTECH_MUSIC_Package
        path: windows-app/build/
