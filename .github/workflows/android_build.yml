name: Android CI

on:
  push:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]
  pull_request:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get Short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build Release APKs
      env:
        APP_VERSION_TAG: "v1.2-${{ steps.vars.outputs.sha_short }}"
      run: ./gradlew :app:assembleRelease :our-music:assembleRelease

    - name: Setup Android Build Tools
      run: |
        export BUILD_TOOLS_VERSION="34.0.0"
        echo "BUILD_TOOLS_VERSION=${BUILD_TOOLS_VERSION}" >> $GITHUB_ENV
        # We also create a symlink from default location that sign-android-release searches for to the one we actually have
        sudo mkdir -p /usr/local/lib/android/sdk/build-tools/29.0.3/
        sudo ln -sf /usr/local/lib/android/sdk/build-tools/34.0.0/zipalign /usr/local/lib/android/sdk/build-tools/29.0.3/zipalign
        sudo ln -sf /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner /usr/local/lib/android/sdk/build-tools/29.0.3/apksigner
    - name: Sign App APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Sign Our-Music APK
      uses: r0adkll/sign-android-release@v1
      id: sign_our_music
      with:
        releaseDirectory: our-music/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release
        cp ${{steps.sign_app.outputs.signedReleaseFile}} release/music-downloader-release.apk
        cp ${{steps.sign_our_music.outputs.signedReleaseFile}} release/our-music-release.apk

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-apks
        path: release/

    - name: Create or Update Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "release/music-downloader-release.apk,release/our-music-release.apk"
        tag: "v1.2-${{ steps.vars.outputs.sha_short }}"
        name: "Release ${{ steps.vars.outputs.sha_short }}"
        body: "Automated release build."
        makeLatest: true
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
