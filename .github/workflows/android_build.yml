name: Android CI

on:
  push:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]
  pull_request:
    branches: [ "main", "music-downloader-app-7315293495363157775" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release
        # Find the release APK. Usually app/build/outputs/apk/release/app-release-unsigned.apk
        # We rename it to something nicer
        cp app/build/outputs/apk/release/app-release-unsigned.apk release/music-downloader-release.apk || cp app/build/outputs/apk/release/app-release.apk release/music-downloader-release.apk

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: release/
