<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTECH MUSIC // PREASX24</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .splash {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 20% 30%, #001a2b, #000 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            isolation: isolate;
        }

        /* Grid background */
        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 166, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 166, 255, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            animation: gridPulse 4s infinite alternate;
        }

        @keyframes gridPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* Animated waveform (canvas) */
        #waveformCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 90%;
            animation: fadeIn 2s ease-out;
        }

        /* DTECH logo with glitch */
        .dtech {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -0.02em;
            line-height: 1;
            color: #00a6ff;
            text-shadow:
                0 0 20px #00a6ff,
                2px 2px 0 #003366,
                -2px -2px 0 #0066aa;
            animation: glitch 3s infinite;
            margin-bottom: 0.1em;
        }

        .dtech span {
            display: inline-block;
            animation: flicker 5s infinite;
        }

        /* MUSIC */
        .music {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            font-style: italic;
            color: transparent;
            -webkit-text-stroke: 2px #00a6ff;
            letter-spacing: 0.4em;
            margin-left: 0.4em; /* compensate for spacing */
            text-shadow: 0 0 10px rgba(0, 166, 255, 0.5);
            margin-bottom: 0.5em;
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 10px rgba(0, 166, 255, 0.5); }
            100% { text-shadow: 0 0 25px rgba(0, 166, 255, 1); }
        }

        /* Preasx24 */
        .preasx {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            font-family: 'Courier New', monospace;
            color: #00a6ff;
            text-shadow: 0 0 15px #00a6ff;
            letter-spacing: 0.3em;
            margin-right: -0.3em; /* compensate for letter spacing */
            border-right: 3px solid #00a6ff;
            padding-right: 0.5em;
            display: inline-block;
            animation: blink 1.5s step-end infinite;
            margin-bottom: 2rem;
        }

        /* Progress bar */
        .progress {
            width: min(500px, 80vw);
            height: 3px;
            background: rgba(0, 166, 255, 0.2);
            margin: 2rem auto;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #00a6ff;
            box-shadow: 0 0 20px #00a6ff;
            animation: fillProgress 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: white;
            filter: blur(10px);
            animation: scan 2s linear infinite;
        }

        /* Terminal lines */
        .terminal {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            color: #00a6ff;
            font-size: 0.9rem;
            opacity: 0.7;
            z-index: 11;
            text-align: left;
            max-width: 450px;
        }

        .terminal-line {
            margin: 0.5rem 0;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid transparent;
            /* staggered typing animation */
            width: 0;
        }

        .terminal-line:nth-child(1) { animation: typing 1.5s steps(40, end) forwards; animation-delay: 0.2s; }
        .terminal-line:nth-child(2) { animation: typing 1.5s steps(40, end) forwards; animation-delay: 1.7s; }
        .terminal-line:nth-child(3) { animation: typing 1.5s steps(40, end) forwards; animation-delay: 3.2s; }
        .terminal-line:nth-child(4) { animation: typing 1.5s steps(40, end) forwards; animation-delay: 4.7s; }

        .terminal-line::before {
            content: '>';
            margin-right: 0.8rem;
            color: #00a6ff;
            opacity: 0.8;
            animation: blink 1s step-end infinite;
        }

        /* Data stream (right side) */
        .data-stream {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: #00a6ff;
            font-size: 0.8rem;
            opacity: 0.6;
            z-index: 11;
            text-align: right;
            font-family: monospace;
            pointer-events: none;
        }

        .data-stream div {
            margin: 0.4rem 0;
            animation: dataFade 2s infinite;
        }

        /* Scanning line overlay */
        .scanner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00a6ff, transparent);
            filter: blur(3px);
            opacity: 0.5;
            z-index: 20;
            pointer-events: none;
            animation: scanMove 6s linear infinite;
        }

        /* Floating particles */
        .particles {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            color: #00a6ff;
            font-size: 14px;
            opacity: 0.3;
            animation: floatParticle 12s linear infinite;
            text-shadow: 0 0 5px #00a6ff;
        }

        /* Animations */
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            5% { transform: translate(-2px, 1px); }
            10% { transform: translate(2px, -1px); }
            15% { transform: translate(-1px, 2px); }
            20% { transform: translate(1px, -2px); }
            25% { transform: translate(0); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            30% { opacity: 0.9; }
            31% { opacity: 1; }
            60% { opacity: 0.8; }
            61% { opacity: 1; }
        }

        @keyframes blink {
            0%, 100% { border-color: #00a6ff; opacity: 1; }
            50% { border-color: transparent; opacity: 0; }
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            20% { width: 30%; }
            40% { width: 55%; }
            60% { width: 75%; }
            80% { width: 90%; }
            100% { width: 100%; }
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        @keyframes scanMove {
            0% { top: -10px; }
            100% { top: 110vh; }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes dataFade {
            0% { opacity: 0; transform: translateX(10px); }
            20% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-10px); }
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .terminal { bottom: 1rem; left: 1rem; font-size: 0.7rem; max-width: 80vw; }
            .data-stream { top: 1rem; right: 1rem; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="grid"></div>
        <canvas id="waveformCanvas"></canvas>
        <div class="particles" id="particles"></div>

        <div class="content">
            <div class="dtech">
                <span>D</span>T<span>E</span>C<span>H</span>
            </div>
            <div class="music">MUSIC</div>
            <div class="preasx">PREASX24</div>
            <div class="progress">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="terminal">
            <div class="terminal-line">INITIALIZING AUDIO ENGINE...</div>
            <div class="terminal-line">LOADING YT-DLP BACKEND...</div>
            <div class="terminal-line">ESTABLISHING STREAM TUBE LINK...</div>
            <div class="terminal-line">BUFFERING HIGH-RES AUDIO...</div>
        </div>

        <div class="data-stream" id="dataStream">
            <div>BITRATE: 320kbps</div>
            <div>CODEC: OPUS</div>
            <div>FREQ: 44.1kHz</div>
        </div>

        <div class="scanner"></div>
    </div>

    <script>
        (function() {
            // Waveform canvas: draw smooth animated oscilloscope lines
            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let time = 0;
            function drawWaveform() {
                ctx.clearRect(0, 0, width, height);
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#00a6ff';
                ctx.shadowBlur = 12;

                const lines = 3; // Number of wave lines

                for (let i = 0; i < lines; i++) {
                    ctx.beginPath();
                    // Different opacity for each line to create depth
                    ctx.strokeStyle = `rgba(0, 166, 255, ${0.4 + (i * 0.2)})`;

                    for (let x = 0; x < width; x += 5) {
                        // Complex sine wave combination for visual interest
                        const frequency1 = 0.003 + (i * 0.001);
                        const frequency2 = 0.008 + (i * 0.0015);

                        // Center horizontal alignment
                        const centerY = height / 2;

                        // Amplitudes scale with screen size but stay bounded
                        const amplitude1 = (height * 0.15) * Math.sin(time * 0.01 + i);
                        const amplitude2 = (height * 0.08) * Math.cos(time * 0.02 - i);

                        // Simulated music "beat" pulsing effect
                        const beat = Math.pow(Math.sin(time * 0.05 + i), 4) * (height * 0.05);

                        const y = centerY
                                + Math.sin(x * frequency1 + time * 0.03 + i) * amplitude1
                                + Math.cos(x * frequency2 - time * 0.02 + i) * (amplitude2 + beat);

                        if (x === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }
                    ctx.stroke();
                }

                time += 1;
                requestAnimationFrame(drawWaveform);
            }
            drawWaveform();

            // Floating particles (music notes / audio symbols)
            const particleContainer = document.getElementById('particles');
            const notes = ['♫', '♪', '♩', '♬', 'ıllıllı', 'ılı.lıllılı.ıllı'];
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.textContent = notes[Math.floor(Math.random() * notes.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 12 + 's';
                p.style.fontSize = (Math.random() * 15 + 10) + 'px';
                particleContainer.appendChild(p);
            }

            // Update data stream periodically with audio stats
            const dataStream = document.getElementById('dataStream');
            const stats = [
                () => `BITRATE: ${[128, 192, 256, 320][Math.floor(Math.random()*4)]}kbps`,
                () => `CODEC: ${['OPUS', 'AAC', 'FLAC', 'ALAC', 'VORBIS'][Math.floor(Math.random()*5)]}`,
                () => `FREQ: ${[44.1, 48.0, 96.0, 192.0][Math.floor(Math.random()*4)]}kHz`,
                () => `CHANNELS: ${['STEREO', 'SURROUND', 'MONO', '7.1'][Math.floor(Math.random()*4)]}`,
                () => `BUFFER: ${Math.floor(Math.random() * 30 + 70)}%`, // 70-100%
                () => `LATENCY: ${Math.floor(Math.random() * 40) + 12}ms`,
                () => `PEAK: -${(Math.random() * 6).toFixed(1)}dB`,
                () => `ENGINE: CORE_AUDIO_V2`,
                () => `DSP: ACTIVE`
            ];

            function refreshData() {
                const newDiv = document.createElement('div');
                newDiv.textContent = stats[Math.floor(Math.random() * stats.length)]();
                dataStream.insertBefore(newDiv, dataStream.firstChild);
                if (dataStream.children.length > 5) {
                    dataStream.removeChild(dataStream.lastChild);
                }
            }
            setInterval(refreshData, 1500);

        })();
    </script>
</body>
</html>
